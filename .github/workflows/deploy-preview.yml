# Deploys the site to Cloudflare Pages: main to production, each pull request's
# branch to its own preview. For a pull request it then records a GitHub
# Deployment on the head commit, so the scenescout-qa gate can find the preview.
name: deploy-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    # Forks get no secrets; skip them rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          set -euo pipefail
          npx -y wrangler@4.146.0 pages deploy public \
            --project-name scenescout-sandbox-qa --branch "$BRANCH" | tee deploy.log
          if [ "$BRANCH" = main ]; then
            url="https://scenescout-sandbox-qa.pages.dev"
          else
            # Prefer the alias wrangler prints; otherwise derive it the way Pages does.
            url="$(sed -nE 's/.*[Aa]lias URL: *(https:[^ ]+).*/\1/p' deploy.log | tail -n1)"
            if [ -z "$url" ]; then
              alias="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]/-/g' | cut -c1-28 | sed -E 's/-+$//')"
              url="https://${alias}.scenescout-sandbox-qa.pages.dev"
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

  record:
    needs: deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          set -euo pipefail
          id="$(jq -n --arg sha "$SHA" '{ref: $sha, environment: "preview", auto_merge: false,
              required_contexts: [], transient_environment: true, description: "Cloudflare Pages preview"}' \
            | gh api -X POST "repos/$REPO/deployments" --input - -q .id)"
          jq -n --arg url "$URL" '{state: "success", environment_url: $url, auto_inactive: true}' \
            | gh api -X POST "repos/$REPO/deployments/$id/statuses" --input - > /dev/null
          echo "Recorded deployment $id for $SHA at $URL"
